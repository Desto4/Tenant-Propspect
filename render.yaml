services:
  - type: web
    name: mmg-agent
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: gunicorn flask_app_new:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.browsers
      # Secrets below should be set in the Render dashboard, NOT committed:
      #   ANTHROPIC_API_KEY, APOLLO_API_KEY, HUBSPOT_TOKEN,
      #   PERPLEXITY_API_KEY, GEMINI_API_KEY, GMAIL_ADDRESS, GMAIL_APP_PASSWORD
