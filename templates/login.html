<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMG Agent — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-[#0f1623] flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-teal-500 rounded-2xl mb-4">
                <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">MMG Agent</h1>
            <p class="text-gray-400 text-sm mt-1">Sign in to your workspace</p>
        </div>

        <!-- Card -->
        <div class="bg-[#1a2130] rounded-2xl p-8 border border-[#2e3a4e]">
            <div id="error-msg" class="hidden mb-4 text-sm text-red-400 bg-red-900/20 border border-red-800/40 rounded-lg px-4 py-3"></div>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                    <input id="password" type="password" placeholder="Enter your password"
                        class="w-full bg-[#242d3d] border border-[#2e3a4e] text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 placeholder-gray-600"
                        onkeydown="if(event.key==='Enter') signIn()">
                </div>
                <button onclick="signIn()" id="sign-in-btn"
                    class="w-full bg-teal-500 hover:bg-teal-400 text-white font-semibold py-3 rounded-xl transition-colors text-sm">
                    Sign in
                </button>
            </div>
            <p class="text-center text-xs text-gray-600 mt-5">Default password: <span class="text-gray-400 font-mono">admin</span></p>
        </div>
    </div>

    <script>
    async function signIn() {
        const password = document.getElementById('password').value;
        const btn = document.getElementById('sign-in-btn');
        const errEl = document.getElementById('error-msg');
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        errEl.classList.add('hidden');
        try {
            const resp = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password })
            });
            const data = await resp.json();
            if (data.ok) {
                window.location.href = '/';
            } else {
                errEl.textContent = data.error || 'Incorrect password';
                errEl.classList.remove('hidden');
            }
        } catch(e) {
            errEl.textContent = 'Connection error. Try again.';
            errEl.classList.remove('hidden');
        }
        btn.disabled = false;
        btn.textContent = 'Sign in';
    }
    </script>
</body>
</html>
